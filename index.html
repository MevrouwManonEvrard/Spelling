<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Platform</title>
<style>
body{
font-family:Arial,sans-serif;
background:#1a1a2e;
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.container{text-align:center;width:90%;max-width:900px;}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-top:30px;
}
.btn{
background:#16213e;
border:none;
border-radius:16px;
padding:30px;
color:white;
font-size:1.2rem;
cursor:pointer;
}
.btn:hover{transform:scale(1.05);}
</style>
</head>
<body>
<div class="container">
<h1>Kies een niveau</h1>
<div class="grid">
<button class="btn" onclick="location.href='niveau1.html'">Niveau 1</button>
<button class="btn" onclick="alert('Nog niet beschikbaar')">Niveau 2</button>
<button class="btn" onclick="alert('Nog niet beschikbaar')">Niveau 3</button>
<button class="btn" onclick="alert('Nog niet beschikbaar')">Niveau 4</button>
<button class="btn" onclick="alert('Nog niet beschikbaar')">Niveau 5</button>
<button class="btn" onclick="alert('Nog niet beschikbaar')">Niveau 6</button>
</div>
</div>
</body>
</html>
