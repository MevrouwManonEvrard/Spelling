let score = 0;
let round = 1;
let currentWord = '';
let combo = 0;
let selectedBox = null;
let boxes = [];
let boxStates = {};

function getBoxColor(attempts) {
  if (attempts === 1) return { bg: '#22c55e', text: '#166534', border: '#22c55e' };
  if (attempts === 2) return { bg: '#86efac', text: '#166534', border: '#86efac' };
  if (attempts === 3) return { bg: '#facc15', text: '#713f12', border: '#facc15' };
  if (attempts === 4) return { bg: '#fb923c', text: '#7c2d12', border: '#fb923c' };
  return { bg: '#ef4444', text: '#fff', border: '#ef4444' };
}

function createGrid() {
  const grid = document.getElementById('gridContainer');
  grid.innerHTML = '';
  boxes = [];
  boxStates = {};
  
  const selectedWords = [];
  for (let i = 0; i < 20; i++) {
    selectedWords.push(words[Math.floor(Math.random() * words.length)]);
  }
  
  selectedWords.forEach((word, idx) => {
    const box = document.createElement('button');
    box.className = 'w-full aspect-square rounded-lg flex items-center justify-center text-sm font-bold transition-all cursor-pointer hover:scale-105 active:scale-95';
    box.style.background = '#0f3460';
    box.style.color = '#7a7a9d';
    box.style.border = '2px solid #2a2a4a';
    box.textContent = '🔊';
    box.dataset.word = word;
    box.dataset.idx = idx;
    
    boxStates[idx] = { word: word, completed: false, attempted: false, attempts: 0 };
    
    box.addEventListener('click', () => selectBox(box, word, idx));
    grid.appendChild(box);
    boxes.push(box);
  });
  
  document.getElementById('feedback').textContent = '';
  document.getElementById('wordInput').value = '';
  document.getElementById('inputWrap').className = 'relative';
}

function selectBox(box, word, idx) {
  if (boxStates[idx].completed) {
    return;
  }
  
  boxes.forEach(b => {
    const bIdx = parseInt(b.dataset.idx);
    if (!boxStates[bIdx].completed && !boxStates[bIdx].attempted) {
      b.style.background = '#0f3460';
      b.style.color = '#7a7a9d';
      b.style.borderColor = '#2a2a4a';
    }
  });
  
  selectedBox = box;
  box.style.background = '#2a2a4a';
  box.style.color = '#fff';
  box.style.borderColor = '#e94560';
  
  currentWord = word;
  selectedBox.dataset.currentIdx = idx;
  document.getElementById('feedback').textContent = '';
  document.getElementById('wordInput').value = '';
  
  speak(word);
}

function updateComboDisplay() {
  const comboContainer = document.getElementById('comboContainer');
  if (combo > 0) {
    comboContainer.style.display = 'flex';
    document.getElementById('combo').textContent = combo + 'x';
  } else {
    comboContainer.style.display = 'none';
  }
}

function speak(word) {
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'nl-BE';
  u.rate = 0.4;
  u.pitch = 0.9;
  u.volume = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

document.getElementById('wordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (!selectedBox) {
      document.getElementById('feedback').innerHTML = `<span style="color:#ef4444;">Kies eerst een vakje!</span>`;
      return;
    }
    
    const val = e.target.value.trim().toLowerCase();
    const wrap = document.getElementById('inputWrap');
    const fb = document.getElementById('feedback');
    const idx = parseInt(selectedBox.dataset.currentIdx);
    
    if (val === currentWord) {
      combo++;
      score += combo;
      document.getElementById('score').textContent = score;
      updateComboDisplay();
      
      const comboText = combo > 1 ? `<span style="color:#22c55e;">✓ Correct! ${combo}x combo!</span>` : `<span style="color:#22c55e;">✓ Correct!</span>`;
      fb.innerHTML = comboText;
      wrap.className = 'relative correct-pulse';
      
      if (combo > 1) {
        document.getElementById('combo').classList.add('combo-pop');
        setTimeout(() => document.getElementById('combo').classList.remove('combo-pop'), 400);
      }
      
      boxStates[idx].attempts++;
      boxStates[idx].completed = true;
      boxStates[idx].attempted = false;
      selectedBox.style.pointerEvents = 'none';
      
      const colors = getBoxColor(boxStates[idx].attempts);
      selectedBox.style.background = colors.bg;
      selectedBox.style.color = colors.text;
      selectedBox.style.borderColor = colors.border;
      selectedBox.textContent = '✓';
      
      selectedBox = null;
      document.getElementById('wordInput').value = '';
      
      setTimeout(() => {
        const allCompleted = Object.values(boxStates).every(state => state.completed);
        if (allCompleted) {
          showGameOver();
        }
      }, 800);
    } else {
      combo = 0;
      updateComboDisplay();
      fb.innerHTML = `<span style="color:#ef4444;">✗ Fout! Het was: <strong>${currentWord}</strong></span>`;
      wrap.className = 'relative wrong-pulse';
      
      boxStates[idx].attempts++;
      boxStates[idx].attempted = true;
      selectedBox.style.background = '#ef4444';
      selectedBox.style.color = '#fff';
      selectedBox.style.borderColor = '#ef4444';
      selectedBox.style.pointerEvents = 'auto';
      selectedBox.textContent = '✗';
      document.getElementById('wordInput').value = '';
    }
    
    round++;
  }
});

}

const defaultConfig = {

function applyConfig(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const primary = config.primary_action_color || defaultConfig.primary_action_color;
  const secondary = config.secondary_action_color || defaultConfig.secondary_action_color;
  const font = config.font_family || defaultConfig.font_family;
  const size = config.font_size || defaultConfig.font_size;

  const app = document.getElementById('app');
  app.style.background = bg;
  app.style.fontFamily = `${font}, sans-serif`;

  document.getElementById('title').textContent = config.game_title || defaultConfig.game_title;
  document.getElementById('title').style.color = primary;

  document.querySelectorAll('[style*="16213e"]').forEach(el => el.style.background = surface);
